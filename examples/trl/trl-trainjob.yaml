# Plain TrainJob for the TRL PoC -- kubectl apply only, no SDK.
#
# spec.trainer.args replaces the runtime's container args rather than appending
# to them, so the runtime's paths have to be repeated here.
#
# Set TRL_SKIP_ACCELERATE_ARGS=1 on the trainer container for the control run.

apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: trl-sft-qwen
  namespace: default
spec:
  runtimeRef:
    name: trl-qwen2.5-1.5b
  trainer:
    numNodes: 2
    resourcesPerNode:
      limits:
        nvidia.com/gpu: 1
    args:
      - --model_name_or_path=/workspace/model
      - --dataset_name=/workspace/dataset
      - --output_dir=/workspace/output
      # LoRA keeps a 1.5B model inside a single 24GB card.
      - --use_peft
      - --lora_r=16
      - --lora_alpha=32
      - --max_steps=20
      - --per_device_train_batch_size=1
      - --learning_rate=2e-5
      - --logging_steps=1
      - --report_to=none
